<!doctype html>
<html lang="de" data-theme="light" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speedload</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5bd3'/%3E%3Cpath d='M12 5v10M7.5 10.5 12 15l4.5-4.5M7 19h10' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Farbschema vor dem ersten Zeichnen setzen, sonst blitzt kurz das falsche auf
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('sl-theme') || 'system'; } catch (e) {}
  var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<style>
/* ===== Tokens ===== */
:root,:root[data-theme=light]{color-scheme:light;
  --bg:#f5f5f3;--surface:#fff;--inset:#eeeeec;--hover:rgb(0 0 0/.035);
  --border:rgb(0 0 0/.08);--border-hi:rgb(0 0 0/.15);--text:#1a1a1c;--text-muted:#67676d;
  --accent:var(--acc,#2f5bd3);--accent-contrast:#fff;--success:#17803d;--warn:#a35c00;--danger:#c4302b;
  --track:rgb(0 0 0/.07);
  --shadow:0 1px 2px rgb(0 0 0/.04),0 12px 32px -16px rgb(0 0 0/.18);--shadow-sm:0 1px 2px rgb(0 0 0/.05)}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#121214;--surface:#1a1a1d;--inset:#242428;--hover:rgb(255 255 255/.04);
  --border:rgb(255 255 255/.08);--border-hi:rgb(255 255 255/.16);--text:#ececee;--text-muted:#9b9ba3;
  --accent:color-mix(in oklab,var(--acc,#2f5bd3) 72%,#fff);--accent-contrast:#0f1013;--success:#4ccb83;--warn:#e5a44a;--danger:#ff7468;
  --track:rgb(255 255 255/.09);
  --shadow:0 1px 2px rgb(0 0 0/.4),0 16px 36px -18px rgb(0 0 0/.8);--shadow-sm:0 1px 2px rgb(0 0 0/.3)}
:root{--ring:color-mix(in srgb,var(--accent) 38%,transparent);
  --font:system-ui,-apple-system,"Segoe UI",Ubuntu,Cantarell,"Noto Sans",sans-serif;--mono:ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,monospace;
  --r-s:8px;--r-m:12px;--r-l:16px;
  --dur-fast:120ms;--dur-base:220ms;--dur-slow:380ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --z-bar:10;--z-pop:30;--z-toast:50;--z-overlay:60}

/* ===== Grundlagen ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;font:14px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:var(--ring)}
button,input,select{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--accent)}
code{font:12.5px/1.4 var(--mono)}
kbd{font:11px/1 var(--mono);padding:3px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap;cursor:pointer;text-decoration:none;
  transition:transform var(--dur-fast) var(--ease-out),background-color var(--dur-base) var(--ease-out),border-color var(--dur-base),box-shadow var(--dur-base) var(--ease-out),color var(--dur-base)}
.btn:hover{border-color:var(--border-hi);background:color-mix(in oklab,var(--surface),var(--text) 4%)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-contrast);font-weight:600}
.btn.primary:hover{background:color-mix(in oklab,var(--accent),#000 8%);transform:translateY(-1px);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.primary:active{transform:scale(.97);box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff;font-weight:600}
.btn.danger:hover{background:color-mix(in oklab,var(--danger),#000 8%)}
.icon{width:36px;height:36px;padding:0;min-height:0}
input[type=text],select{height:38px;padding:0 12px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);transition:border-color var(--dur-base),box-shadow var(--dur-base)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input::placeholder{color:var(--text-muted)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}

/* ===== Kopfzeile ===== */
.top{position:sticky;top:0;z-index:var(--z-bar);display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100vw - 1040px)/2 + 16px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid transparent;transition:border-color var(--dur-base)}
.top.scrolled{border-bottom-color:var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-contrast)}
.mark svg{width:16px;height:16px;stroke-width:2.2}
.logo{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.speed{display:flex;align-items:center;gap:10px;min-width:0}
.tot{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
#total{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
#counts{color:var(--text-muted);font-size:12px;white-space:nowrap}
#gspark{width:84px;height:28px;display:block}
#gspark .line{stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
#gspark .area{fill:url(#gsfill);stroke:none}
#gspark stop{stop-color:var(--accent)}

/* ===== Inhalt ===== */
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 96px}
.add{position:relative;display:flex;gap:8px;margin-bottom:18px}
.add .add-ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;pointer-events:none}
.add input{flex:1;height:48px;padding-inline-start:42px;font-size:15px;border-radius:var(--r-m);box-shadow:var(--shadow-sm)}
.add .btn{height:48px;padding:0 20px;border-radius:var(--r-m)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.hint{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow-sm);animation:rise var(--dur-slow) var(--ease-out) both}
.hint .h-ic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hint .h-tx{flex:1 1 240px;min-width:0}
.hint b{display:block;font-weight:600}
.hint span{color:var(--text-muted);font-size:13px}
.hint .h-act{display:flex;gap:6px;margin-inline-start:auto}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tabs{position:relative;display:flex;gap:2px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--inset);border-radius:10px}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:5px 12px;border:0;border-radius:7px;background:none;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color var(--dur-base)}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--text)}
.tabs button b{font-weight:500;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tabs .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:7px;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.1),0 0 0 .5px var(--border);transition:transform var(--dur-slow) var(--ease-out),width var(--dur-slow) var(--ease-out)}
.bulk{display:flex;gap:2px;flex-wrap:wrap}
.bulk .btn{min-height:32px;padding:0 10px;font-size:13px}
.bulk svg{width:16px;height:16px}

/* ===== Liste ===== */
main{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow-sm);overflow:hidden}
main:empty{display:none}
.job{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:2px 14px;padding:13px 16px;border-bottom:1px solid var(--border);overflow:hidden;
  transition:background-color var(--dur-base),opacity var(--dur-base),height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.job:last-child{border-bottom:0}
.job:hover{background:var(--hover)}
.job.in{animation:rowIn var(--dur-slow) var(--ease-out) both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
.job.out{opacity:0;height:0!important;padding-top:0;padding-bottom:0;border-bottom-width:0;pointer-events:none}
.job.yay{animation:yay 1.2s var(--ease-out)}
@keyframes yay{from{background:color-mix(in srgb,var(--success) 14%,transparent)}}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.body{min-width:0;display:grid;gap:2px}
.line1{display:flex;align-items:center;gap:10px;min-width:0}
.name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip{flex:none;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--text-muted);background:var(--inset)}
[data-st=run] .chip,[data-st=wait] .chip{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
[data-st=done] .chip{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}
[data-st=error] .chip{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.job.retry .chip{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.sub{color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:4px;margin:6px 0 4px;border-radius:99px;overflow:hidden;background:var(--track)}
.bar i{position:absolute;inset:0;background:var(--accent);border-radius:inherit;transform-origin:left;transform:scaleX(0)}
[data-st=pause] .bar i,[data-st=queue] .bar i,[data-st=error] .bar i{background:var(--text-muted);opacity:.55}
[data-st=done] .bar{display:none}
.bar.indet i{transform:none;width:35%;animation:indet 1.3s var(--ease-in-out) infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
.stats{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:0}
.stats .pct{color:var(--text);font-weight:600}
.stats>span:empty{display:none}
.err{font-size:12.5px;color:var(--danger);overflow-wrap:anywhere}
.job.retry .err{color:var(--warn)}
.err:empty{display:none}
.acts{display:flex;gap:2px;opacity:.7;transition:opacity var(--dur-base)}
.job:hover .acts,.job:focus-within .acts{opacity:1}
.acts .btn{width:32px;height:32px;min-height:0;padding:0}
.acts svg{width:16px;height:16px}
.compact .job{padding:8px 14px;grid-template-columns:30px minmax(0,1fr) auto}
.compact .ico{width:30px;height:30px;border-radius:8px;font-size:8.5px}
.compact .sub{display:none}
.compact .bar{margin:4px 0 2px;height:3px}

#empty{padding:56px 24px;text-align:center;color:var(--text-muted);background:var(--surface);border:1px dashed var(--border-hi);border-radius:var(--r-m);animation:rise var(--dur-slow) var(--ease-out)}
#empty .art{display:inline-grid;place-items:center;width:56px;height:56px;margin-bottom:14px;border-radius:16px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
#empty .art svg{width:26px;height:26px}
#empty h2{color:var(--text);font-size:17px;font-weight:600;margin:0 0 4px}
#empty p{margin:0 auto;max-width:420px}

/* ===== Seitenleiste & Dialoge ===== */
dialog{color:var(--text)}
dialog::backdrop{background:rgb(0 0 0/.32);animation:fade var(--dur-slow)}
.closing::backdrop{animation:fadeOut .2s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.drawer{margin:0;margin-inline-start:auto;padding:0;width:min(440px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;border:0;border-inline-start:1px solid var(--border);background:var(--bg);box-shadow:var(--shadow)}
.drawer[open]{animation:drIn var(--dur-slow) var(--ease-out)}
.drawer.closing{animation:drOut .22s ease-in forwards}
@keyframes drIn{from{transform:translateX(100%)}}
@keyframes drOut{to{transform:translateX(100%)}}
.dr-in{height:100%;display:flex;flex-direction:column}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.dr-head h2{margin:0;font-size:17px;font-weight:600}
.dr-body{flex:1;overflow:auto;padding:8px 20px 32px}
.dr-body h3{margin:20px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:11px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;position:relative}
.row:last-child{border-bottom:0}
.row>span:first-child{min-width:0}
.row small{display:block;color:var(--text-muted);font-size:12.5px}
.row.col{display:grid;gap:8px;justify-content:stretch}
.lbl{display:flex;justify-content:space-between;gap:10px}
.lbl output{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.row input[type=text],.row select{width:100%}

.seg{position:relative;display:inline-flex;padding:3px;background:var(--inset);border-radius:9px}
.seg label{position:relative;z-index:1;cursor:pointer}
.seg input,.tog input,.swatches input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:4px 12px;border-radius:7px;color:var(--text-muted);font-size:13px;font-weight:500;white-space:nowrap;transition:color var(--dur-base)}
.seg label:hover span,.seg input:checked+span{color:var(--text)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:7px;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.12),0 0 0 .5px var(--border);transition:transform var(--dur-slow) var(--ease-out),width var(--dur-slow) var(--ease-out)}

.tog{cursor:pointer}
.tog i{flex:none;position:relative;width:40px;height:24px;border-radius:99px;background:var(--track);transition:background var(--dur-base)}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform var(--dur-slow) var(--ease-out)}
.tog input:checked+i{background:var(--accent)}
.tog input:checked+i::after{transform:translateX(16px)}
.tog input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{cursor:pointer;display:grid}
.swatches span{width:24px;height:24px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1px rgb(0 0 0/.12);transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base)}
.swatches label:hover span{transform:scale(1.1)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--s)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}

.pick{min-width:150px;justify-content:space-between}
.pick svg{width:14px;height:14px;transition:transform var(--dur-base) var(--ease-out)}
.pick[aria-expanded=true] svg{transform:rotate(180deg)}
.menu{position:absolute;z-index:var(--z-pop);inset-inline-end:0;top:calc(100% - 4px);min-width:200px;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow);transform-origin:top right;animation:menuIn var(--dur-base) var(--ease-out)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.menu li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu li:hover,.menu li.cur{background:var(--hover)}
.menu li[aria-selected=true]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ext-st{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex:none}
.dot.on{background:var(--success)}
.about p{margin:6px 0;color:var(--text-muted);font-size:13px}

/* Dialoge */
.modal{width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--border);border-radius:var(--r-l);background:var(--bg);box-shadow:var(--shadow);overflow:auto}
.modal[open]{animation:popIn var(--dur-slow) var(--ease-out)}
.modal.closing{animation:popOut .18s ease-in forwards}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes popOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
.ask{width:min(400px,calc(100vw - 32px));padding:22px}
.ask h2{margin:0 0 6px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.ask p{margin:0 0 20px;color:var(--text-muted)}
.ask .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.wz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 0}
.wz-head h2{margin:0;font-size:18px;font-weight:600}
.wz-head p{margin:4px 0 0;color:var(--text-muted)}
.wz-body{padding:16px 22px 22px}
.wz-body .seg{display:flex;margin-bottom:18px}
.wz-body .seg label{flex:1;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps>li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);animation:rise var(--dur-slow) var(--ease-out) both}
.steps>li:nth-child(2){animation-delay:40ms}.steps>li:nth-child(3){animation-delay:80ms}
.steps>li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--inset);font-size:13px;font-weight:600;color:var(--text-muted)}
.steps>li>div{min-width:0;display:grid;gap:8px}
.steps b{font-weight:600;line-height:26px}
.steps p{margin:0;color:var(--text-muted);font-size:13.5px}
.steps .note{font-size:12.5px;color:var(--warn)}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.code{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:2px 2px 2px 10px;background:var(--inset);border-radius:7px}
.code code{overflow-wrap:anywhere;min-width:0}
.code .btn{width:28px;height:28px;min-height:0;padding:0}
.code svg{width:14px;height:14px}
.acts-row{display:flex;flex-wrap:wrap;gap:8px}
.wz-st{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:var(--r-m);background:var(--inset);color:var(--text-muted);font-size:13.5px}
.wz-st.ok{background:color-mix(in srgb,var(--success) 13%,transparent);color:var(--success);font-weight:600}
.wz-st .spin{width:16px;height:16px;margin:0;border-width:2px}
.privacy{margin:12px 0 0;font-size:12.5px;color:var(--text-muted)}
.upd{width:min(460px,calc(100vw - 32px));padding:22px}
.upd .u-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.upd .u-ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.upd h2{margin:0;font-size:16.5px;font-weight:600}
.upd .u-ver{color:var(--text-muted);font-size:13px;font-variant-numeric:tabular-nums}
.upd .notes{max-height:200px;overflow:auto;margin:0 0 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);font:13px/1.55 var(--font);color:var(--text-muted);white-space:pre-wrap;overflow-wrap:anywhere}
.upd .notes:empty{display:none}
.upd .u-msg{margin:0 0 16px;color:var(--text-muted)}
.upd .u-msg.bad{color:var(--danger)}
.upd .u-bar{height:6px;margin:4px 0 8px;border-radius:99px;background:var(--track);overflow:hidden}
.upd .u-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transform-origin:left;transform:scaleX(0);transition:transform .2s linear}
.upd .u-pct{font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-bottom:16px}
.upd .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upd .btns>:first-child:last-child,.upd .btns .primary{grid-column:1/-1}

/* ===== Meldungen & Overlays ===== */
#toasts{position:fixed;inset-inline-end:16px;bottom:16px;z-index:var(--z-toast);display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border:1px solid var(--border);border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow);animation:toastIn var(--dur-slow) var(--ease-out);transition:opacity var(--dur-base),transform var(--dur-base) var(--ease-out)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.toast.ok::before{background:var(--success)}
.toast.bad::before{background:var(--danger)}
.toast span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast.out{opacity:0;transform:translateY(8px) scale(.98)}
.toast .btn{min-height:30px;padding:0 10px;font-size:13px}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
#drop{position:fixed;inset:12px;z-index:var(--z-overlay);display:grid;place-items:center;border:2px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(8px);color:var(--accent);font-size:19px;font-weight:600;opacity:0;transform:scale(.985);pointer-events:none;transition:opacity var(--dur-base),transform var(--dur-slow) var(--ease-out)}
#drop.on{opacity:1;transform:none}
#drop svg{width:40px;height:40px;margin:0 auto 10px;display:block}
#off{position:fixed;inset:0;z-index:var(--z-overlay);display:grid;place-items:center;padding:24px;text-align:center;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);animation:fade var(--dur-slow)}
#off h2{margin:0 0 6px;font-size:18px}
#off p{margin:0;color:var(--text-muted);max-width:420px}
.spin{width:30px;height:30px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:640px){
  #gspark{display:none}
  .add .btn span{display:none}
  .add .btn{width:48px;padding:0}
  .job{grid-template-columns:34px minmax(0,1fr)}
  .ico{align-self:start}
  .acts{grid-column:1/-1;justify-content:flex-end;opacity:1}
  .hint{flex-wrap:wrap}
  .bulk span{display:none}
  .bulk .btn{width:36px;padding:0}
}

/* ===== Bewegung ===== */
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after,html[data-motion=off] ::backdrop{animation:none!important;transition:none!important}
.theme-switching *,.theme-switching *::before,.theme-switching *::after{transition:none!important}
.theme-reveal::view-transition-old(root),.theme-reveal::view-transition-new(root){animation:none;mix-blend-mode:normal}
.theme-reveal::view-transition-old(root){z-index:1}
.theme-reveal::view-transition-new(root){z-index:2}
.theme-fade,.theme-fade *{transition:background-color 250ms ease,color 250ms ease,border-color 250ms ease!important}
</style>

    root.classList.add('theme-fade'); set();
    setTimeout(() => root.classList.remove('theme-fade'), 300);
    return;
  }
  root.classList.add('theme-switching');
  if (origin) root.classList.add('theme-reveal');
  const tr = document.startViewTransition(set);
  if (origin) {
    const { x, y } = origin, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    tr.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
      { duration: 700, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' }));
  }
  tr.finished.finally(() => root.classList.remove('theme-switching', 'theme-reveal'));
}
function originOf(el) {

  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };

// Gleitende Markierung in Segment-Schaltern

// ---------- Liste ----------
function makeCard(j, i) {
  const el = document.createElement('article');
  el.className = 'job in';
  el.style.animationDelay = Math.min(i, 8) * 35 + 'ms';
  el.innerHTML = `<div class="ico"></div>
    <div class="body">
      <div class="line1"><span class="name"></span><span class="chip"></span></div>
      <div class="sub"></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      <div class="stats"><span class="pct"></span><span class="sz"></span><span class="spd"></span><span class="eta"></span></div>
      <div class="err"></div>
    </div>
    <div class="acts">${['pause', 'resume', 'retry', 'openfile', 'folder', 'copy', 'remove'].map(a =>
      `<button class="btn ghost" data-act="${a}" title="${t('act.' + a)}" aria-label="${t('act.' + a)}">${svg(a)}</button>`).join('')}</div>`;
  el.addEventListener('animationend', e => { if (e.animationName === 'rowIn') { el.classList.remove('in'); el.style.animationDelay = ''; } });
  const c = { el, j, q: s => el.querySelector(s), shown: j.done, sp: j.speed };
  el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(c, b.dataset.act); });

}

function leave(el) {
  if (!smooth()) { el.remove(); return; }
  el.style.height = el.offsetHeight + 'px';
  requestAnimationFrame(() => el.classList.add('out'));
  setTimeout(() => el.remove(), 400);
}

function render(fresh) {
  const list = $('#list');
  const vis = jobs.filter(j => ui.filter === 'all' || GROUP[j.status] === ui.filter).sort((a, b) => b.id - a.id);
  const ids = new Set(vis.map(j => j.id));
  for (const [id, c] of cards) if (!ids.has(id)) { cards.delete(id); leave(c.el); }
  const nextLive = el => { let n = el ? el.nextElementSibling : list.firstElementChild; while (n && n.classList.contains('out')) n = n.nextElementSibling; return n; };
  let prev = null;
  vis.forEach((j, i) => {
    const c = cards.get(j.id) || makeCard(j, fresh ? i : 0);
    if (nextLive(prev) !== c.el) list.insertBefore(c.el, prev ? prev.nextSibling : list.firstChild);
    update(c, j);
    prev = c.el;
  });
  renderMeta(vis.length);
}

function update(c, j) {
  const was = c.j;
  c.j = j;
  if (j.status !== 'run' || was.status !== 'run' || j.done < c.shown) c.shown = j.done; // nur während des Ladens weich hochzählen
  const el = c.el, retry = j.status === 'run' && !!j.err;
  el.dataset.st = j.status;
  el.classList.toggle('retry', retry);
  const name = c.q('.name');
  if (name.textContent !== j.name) name.textContent = name.title = j.name;
  const e = ext(j.name), cat = CAT.find(([, r]) => r.test(e));
  const ico = c.q('.ico');
  ico.style.setProperty('--c', cat ? cat[0] : 'var(--text-muted)');
  ico.textContent = (e || 'file').slice(0, 4).toUpperCase();
  let chip = t(retry ? 'st.retry' : 'st.' + j.status);
  if (j.status === 'queue') chip += ' #' + (jobs.filter(x => x.status === 'queue').sort((a, b) => a.id - b.id).findIndex(x => x.id === j.id) + 1);
  c.q('.chip').textContent = chip;
  const h = host(j.url);
  c.q('.sub').textContent = j.status === 'done' ? t('sub.saved', { host: h, dir: j.dir })
    : j.status === 'run' ? `${h} · ${!j.ranges ? t('sub.norange') : j.conns === 1 ? t('sub.conn1') : t('sub.conns', { n: j.conns })}`
    : h;
  const show = (a, on) => { c.q(`[data-act=${a}]`).hidden = !on; };
  show('pause', ['run', 'wait', 'queue'].includes(j.status));
  show('resume', j.status === 'pause');
  show('retry', j.status === 'error');
  show('openfile', j.status === 'done');
  show('copy', j.status !== 'done');
  c.q('.err').textContent = j.err ? (retry ? t('err.retry') : '') + j.err : '';
  c.q('.bar').classList.toggle('indet', !(j.size > 0) && (j.status === 'run' || j.status === 'wait'));
  if (!smooth()) paint(c, j.done, j.speed);
}

function paint(c, done, speed) {
  const j = c.j, known = j.size > 0, live = j.status === 'run';
  const pct = j.status === 'done' ? 100 : known ? Math.min(99.9, done / j.size * 100) : null;
  const set = (s, v) => { const el = c.q(s); if (el.textContent !== v) el.textContent = v; };
  set('.pct', pct == null ? '' : (pct === 100 ? '100' : nf1.format(pct)) + ' %');
  set('.spd', live ? fmtB(speed) + '/s' : '');
  set('.eta', live && known && speed > 1 ? t('eta', { t: fmtT((j.size - done) / speed) }) : '');
  set('.sz', known ? t('size.of', { a: fmtB(done), b: fmtB(j.size) }) : done ? fmtB(done) : '');
  const bar = c.q('.bar');
  if (!bar.classList.contains('indet')) bar.firstElementChild.style.transform = `scaleX(${(pct || 0) / 100})`;
  bar.setAttribute('aria-valuenow', Math.floor(pct || 0));
}

function spark(el, hist) {
  if (hist.length < 3) { if (el.innerHTML) el.innerHTML = ''; return; }
  const max = Math.max(...hist, 1), pts = hist.slice(-60), step = 100 / (pts.length - 1);
  const xy = pts.map((v, i) => [(i * step).toFixed(2), (27 - v / max * 17).toFixed(2)]);
  const line = 'M' + xy.join('L');
  el.innerHTML = `<defs><linearGradient id="gsfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-opacity=".22"/><stop offset="1" stop-opacity="0"/></linearGradient></defs><path class="area" d="${line}L100,28L0,28Z"/><path class="line" d="${line}"/>`;
}

function renderMeta(visible) {
  const count = g => jobs.filter(j => g === 'all' || GROUP[j.status] === g).length;
  $$('.tabs [data-f]').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.f === ui.filter);
    const n = String(count(b.dataset.f));
    if (b.lastElementChild.textContent !== n) b.lastElementChild.textContent = n;
  });
  moveInd();
  const active = count('active'), queued = jobs.filter(j => j.status === 'queue').length;
  $('#counts').textContent = [active && t('cnt.active', { n: active }), queued && t('cnt.queued', { n: queued }), !active && !queued && t('cnt.idle')].filter(Boolean).join(' · ');
  $('[data-bulk=pause]').disabled = !jobs.some(j => ['run', 'wait', 'queue'].includes(j.status));
  $('[data-bulk=resume]').disabled = !jobs.some(j => ['pause', 'error'].includes(j.status));
  $('[data-bulk=clear]').disabled = !count('done');
  if (!smooth()) $('#total').textContent = '↓ ' + fmtB(totalSpeed()) + '/s';
  spark($('#gspark'), totalHist);
  const e = $('#empty'), k = jobs.length ? 'emptyv' : 'empty';
  e.hidden = visible > 0;
  if (!e.hidden && e.dataset.k !== k) { e.dataset.k = k; $('h2', e).textContent = t(k + '.t'); $('p', e).textContent = t(k + '.p'); }

}

function moveInd() {
  const b = $(`.tabs [data-f="${ui.filter}"]`), ind = $('.tabs .ind');
  if (!b || !b.offsetWidth) return;
  ind.style.width = b.offsetWidth + 'px';
  ind.style.transform = `translateX(${b.offsetLeft - 3}px)`;
}

const totalSpeed = () => jobs.reduce((s, j) => s + (j.status === 'run' ? j.speed : 0), 0);

// Zahlen und Balken zwischen zwei Abfragen weich weiterzählen
function frame(now) {
  if (smooth()) {
    for (const c of cards.values()) {
      const j = c.j;
      let target = j.done;
      if (j.status === 'run' && j.speed > 0) target = Math.min(j.size > 0 ? j.size : Infinity, j.done + j.speed * Math.min(1.2, (now - lastPoll) / 1000) * .9);
      c.shown = Math.max(c.shown, c.shown + (target - c.shown) * .18);
      c.sp += (j.speed - c.sp) * .12;
      paint(c, c.shown, c.sp);
    }
    tot.shown += (totalSpeed() - tot.shown) * .12;
    const s = '↓ ' + fmtB(tot.shown) + '/s';
    if ($('#total').textContent !== s) $('#total').textContent = s;
  }
  requestAnimationFrame(frame);
}

// ---------- Aktionen ----------
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(t('toast.copied'), 'ok'); } catch { toast(t('toast.copyfail'), 'bad'); }
}

async function act(c, a) {
  const j = c.j;
  if (a === 'copy') return copy(j.url);
  if (a === 'remove' && j.status !== 'done' && !await ask(t('ask.cancel.t', { name: j.name }), t('ask.cancel.p'), t('ask.cancel.ok'))) return;
  const api = { retry: 'resume', folder: 'open' }[a] || a;
  try {
    await post('/api/' + api, { id: j.id });
    if (a === 'remove') { jobs = jobs.filter(x => x.id !== j.id); render(); }
    poll();
  } catch (e) { toast(String(e), 'bad'); }
}

async function bulk(kind) {
  if (kind === 'clear') { try { await post('/api/clear'); } catch (e) { toast(String(e), 'bad'); } return poll(); }
  const want = kind === 'pause' ? ['run', 'wait', 'queue'] : ['pause', 'error'];
  await Promise.all(jobs.filter(j => want.includes(j.status)).map(j => post('/api/' + kind, { id: j.id }).catch(() => {})));
  poll();
}

async function addUrls(text) {
  const urls = (text || '').split(/\s+/).filter(u => /^https?:\/\/\S+$/i.test(u));
  if (!urls.length) {
    const f = $('#addf'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    toast(t('toast.nolink'), 'bad');
    return false;
  }
  for (const url of urls) {
    try { const r = await post('/api/add', { url }); if (r.dup) toast(t('toast.dup')); }
    catch (e) { toast(String(e), 'bad'); }
  }
  if (ui.filter === 'done') { ui.filter = 'all'; saveSoon(); }
  poll();
  return true;
}

function closeAnimated(d) {
  if (!d.open || d.classList.contains('closing')) return;
  if (!smooth()) { d.close(); return; }
  d.classList.add('closing');
  setTimeout(() => { d.classList.remove('closing'); d.close(); }, 200);
}

function ask(title, text, ok) {
  const d = $('#ask');
  $('#ask-t').textContent = title;
  $('#ask-p').textContent = text;
  $('#ask-ok').textContent = ok;
  d.returnValue = '';
  d.showModal();

function toast(msg, kind = 'info', action) {
  const box = $('#toasts');
  while (box.children.length > 3) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  const s = document.createElement('span');
  s.textContent = msg;
  el.append(s);
  const bye = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  if (action) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = action.label; b.onclick = () => { action.fn(); bye(); }; el.append(b); }
  box.append(el);
  setTimeout(bye, action ? 7000 : 3500);
}

function chime() {
  try {
    const a = new AudioContext(), t0 = a.currentTime;
    [660, 880, 1320].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain(), at = t0 + i * .11;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.12, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + .45);
      o.connect(g).connect(a.destination); o.start(at); o.stop(at + .5);
    });
    setTimeout(() => a.close(), 1200);
  } catch {}
}

function finished(j) {
  const c = cards.get(j.id);
  if (c) { c.el.classList.remove('yay'); void c.el.offsetWidth; c.el.classList.add('yay'); }
  toast(t('toast.done', { name: j.name }), 'ok', { label: t('toast.open'), fn: () => post('/api/openfile', { id: j.id }).catch(e => toast(String(e), 'bad')) });
  if (ui.sound) chime();
  if (ui.notify && 'Notification' in window && Notification.permission === 'granted' && (document.hidden || !document.hasFocus()))
    new Notification(t('notif.t'), { body: j.name, tag: 'sl-' + j.id });
}

// ---------- Abfrage ----------
let timer;
async function poll() {
  clearTimeout(timer);
  try {
    const r = await fetch('/api/list', { cache: 'no-store' });
    jobs = await r.json();
    lastPoll = performance.now();
    online(true);
    for (const j of jobs) {
      const p = seen.get(j.id);
      if (p && p !== 'done' && j.status === 'done') finished(j);
      if (p && p !== 'error' && j.status === 'error') toast(t('toast.err', { name: j.name }), 'bad');
      seen.set(j.id, j.status);
    }
    const sum = totalSpeed();
    if (sum || totalHist.length) { totalHist.push(sum); if (totalHist.length > 60) totalHist.shift(); }
    if (!jobs.some(j => j.status === 'run')) totalHist.length = 0;
    render();
  } catch { online(false); }
  timer = setTimeout(poll, document.hidden ? 2000 : 500);
}

function online(on) {
  const o = $('#off');
  const k = quitting ? 'bye' : 'off';
  $('#off-t').textContent = t(k + '.t');
  $('#off-p').textContent = t(k + '.p');
  $('.spin', o).hidden = quitting;
  if (quitting) { o.hidden = false; return; }
  if (restarting && !on) return; // Update-Fenster bleibt sichtbar, bis die neue Version antwortet
  if (on && restarting) { location.reload(); return; } // neue Version: neue Oberfläche laden
  if (on && !o.hidden && !loaded) loadSettings().catch(() => {});
  o.hidden = on;
}

function fillSettings() {
  $$('[data-k],[data-u]').forEach(el => {
    const v = 'u' in el.dataset ? ui[el.dataset.u] : cfg[el.dataset.k];
    if (el.type === 'radio') el.checked = String(v) === el.value;
    else if (el.type === 'checkbox') el.checked = !!v;
    else {
      if (el.tagName === 'SELECT' && v != null && ![...el.options].some(o => o.value === String(v))) el.add(new Option(fmtB(v * 1024) + '/s', v)); // Wert aus der Datei, nicht in der Liste
      el.value = v ?? '';

  outputs();
  extStatus();
  requestAnimationFrame(segs);
}

function outputs() {
  $$('output[data-for]').forEach(o => {
    const k = o.dataset.for, v = cfg[k];
    o.textContent = k === 'min_size_mb' ? (v ? v + ' MB' : t('s.anysize')) : v ?? '';

function bindSettings() {
  $$('[data-k],[data-u]').forEach(el => {
    el.addEventListener(el.type === 'text' ? 'change' : 'input', async () => {
      if (el.type === 'radio' && !el.checked) return;
      const isUi = 'u' in el.dataset, key = el.dataset.u || el.dataset.k;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'range' || 'num' in el.dataset ? +el.value : el.value.trim();
      if (key === 'notify' && v && 'Notification' in window && Notification.permission !== 'granted') {

function openLang() {
  const m = $('#langm'), b = $('#langb');
  const opts = ['system', ...Object.keys(LANGS)];
  m.innerHTML = '';
  opts.forEach(k => {
    const li = document.createElement('li');
    li.role = 'option';
    li.dataset.v = k;
    li.textContent = k === 'system' ? t('s.langSys') : LANGS[k];
    li.setAttribute('aria-selected', ui.lang === k);
    li.onclick = () => pickLang(k);
    m.append(li);
  });
  m.hidden = false;
  b.setAttribute('aria-expanded', 'true');
  let cur = Math.max(0, opts.indexOf(ui.lang));
  const mark = () => [...m.children].forEach((li, i) => li.classList.toggle('cur', i === cur));
  mark();
  m.focus();
  m.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length; mark(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickLang(opts[cur]); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeLang(); }
  };
}
function closeLang() {
  if ($('#langm').hidden) return;
  $('#langm').hidden = true;
  $('#langb').setAttribute('aria-expanded', 'false');
  $('#langb').focus();
}
function pickLang(k) {

  if (k === ui.lang) return;
  ui.lang = k;
  saveSoon();
  if (document.startViewTransition && smooth()) document.startViewTransition(setLang); else setLang();
}

  const c = e.target.closest('[data-copy]');
  if (c) return copy(c.dataset.copy);
  if (e.target.closest('#wz-folder')) return post('/api/extdir', { open: true }).catch(err => toast(String(err), 'bad'));
  if (e.target.closest('#wz-open')) {
    const r = await post('/api/browser', { b: ui.wizB }).catch(() => ({}));
    const nf = $('#wz-nf');
    nf.hidden = !!r.ok;
    nf.textContent = t('w.notFound', { b: BNAME[ui.wizB] });
  }
});
$$('#wiz [name=wb]').forEach(r => r.addEventListener('change', () => { ui.wizB = r.value; saveSoon(); renderWizard(); segs(); }));
$('#wiz').addEventListener('cancel', e => { e.preventDefault(); closeAnimated(e.currentTarget); });
$('#wz-x').onclick = () => closeAnimated($('#wiz'));

// ---------- Updates (GitHub Releases) ----------
let upd = null, updTimer;
async function checkUpdate(manual) {
  try {
    upd = await (await fetch('/api/update', { cache: 'no-store' })).json();
    if (upd.error) throw upd.error;
  } catch { if (manual) toast(t('u.offline'), 'bad'); return; }
  $('#u-cur').textContent = upd.current;
  if (!upd.newer) { if (manual) toast(t('u.current', { v: upd.current }), 'ok'); return; }
  if (manual || (upd.latest !== ui.updSkip && Date.now() > (ui.updLater || 0))) showUpdate('offer');
}

function showUpdate(state, info = {}) {
  const d = $('#upd'), b = $('#u-body');
  $('#u-t').textContent = t('u.title', { v: upd.latest });
  $('#u-ver').textContent = t('u.from', { v: upd.current });
  const btn = (id, k, cls = '') => `<button class="btn ${cls}" type="button" id="${id}">${t(k)}</button>`;
  const page = `<a class="btn" href="${upd.page}" target="_blank" rel="noopener">${t('u.page')}</a>`;
  if (state === 'offer') {
    b.innerHTML = `<pre class="notes"></pre>${upd.how === 'none' ? `<p class="u-msg">${t('u.none')}</p>` : ''}
      <div class="btns">${upd.how === 'none' ? page : btn('u-go', 'u.install', 'primary')}${btn('u-later', 'u.later')}${btn('u-skip', 'u.skip', 'ghost')}</div>`;
    $('.notes', b).textContent = String(upd.notes || '').replace(/^#+\s*/gm, '').replace(/^[-*]\s+/gm, '• ').trim().slice(0, 1500);
  } else if (state === 'download') {
    const p = info.total ? info.done / info.total : 0;
    if (!$('.u-bar', b)) b.innerHTML = `<p class="u-msg">${t('u.dl')}</p><div class="u-bar"><i></i></div><div class="u-pct"></div>`;
    $('.u-bar i', b).style.transform = `scaleX(${p})`;
    $('.u-pct', b).textContent = info.total ? `${fmtB(info.done)} / ${fmtB(info.total)}` : '';
  } else if (state === 'restart') {
    b.innerHTML = `<p class="u-msg">${t('u.restart')}</p><div class="spin"></div>`;
  } else if (state === 'handoff') {
    b.innerHTML = `<p class="u-msg">${t('u.handoff')}</p><div class="btns">${btn('u-ok', 'close.ok', 'primary')}</div>`;
  } else {
    b.innerHTML = `<p class="u-msg bad"></p><div class="btns">${btn('u-go', 'u.retry', 'primary')}${btn('u-later', 'u.later')}${page}</div>`;
    $('.u-msg', b).textContent = t('u.err', { e: info.err || '?' });
  }
  d.classList.remove('closing');
  if (!d.open) d.showModal();
}

async function installUpdate() {
  try { await post('/api/update/install'); } catch (e) { return showUpdate('error', { err: String(e) }); }
  clearInterval(updTimer);
  updTimer = setInterval(async () => {
    let st;
    try { st = await (await fetch('/api/update/status', { cache: 'no-store' })).json(); }
    catch { return; } // während des Neustarts kurz nicht erreichbar
    if (st.state === 'restart') { restarting = true; showUpdate('restart'); }
    else if (st.state === 'download') showUpdate('download', st);
    else { clearInterval(updTimer); showUpdate(st.state === 'handoff' ? 'handoff' : 'error', st); }
  }, 300);
}
let restarting = false;

$('#upd').addEventListener('click', e => {
  const id = e.target.closest('button')?.id;
  if (id === 'u-go') installUpdate();
  if (id === 'u-later') { ui.updLater = Date.now() + 864e5; saveSoon(); closeAnimated($('#upd')); }
  if (id === 'u-skip') { ui.updSkip = upd.latest; saveSoon(); closeAnimated($('#upd')); }
  if (id === 'u-ok') closeAnimated($('#upd'));
});
$('#upd').addEventListener('cancel', e => { e.preventDefault(); if (!restarting && !updTimer) closeAnimated(e.currentTarget); });
$('#u-check').onclick = () => checkUpdate(true);

// ---------- Ereignisse ----------
$$('[data-ic]').forEach(el => { el.innerHTML = svg(el.dataset.ic); });
$$('[data-bulk]').forEach(b => { b.firstElementChild.innerHTML = P[{ pause: 'pause', resume: 'resume', clear: 'clear' }[b.dataset.bulk]]; });
$('#addf').addEventListener('submit', async e => {
  e.preventDefault();
  if (await addUrls($('#url').value)) $('#url').value = '';
});
$('#setb').onclick = openDrawer;
$('#drclose').onclick = () => closeAnimated($('#drawer'));
$('#drawer').addEventListener('cancel', e => { e.preventDefault(); if ($('#langm').hidden) closeAnimated(e.currentTarget); });
$('#drawer').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAnimated(e.currentTarget);
  else if (!e.target.closest('#langm,#langb')) closeLang();
});
$('#langb').onclick = () => $('#langm').hidden ? openLang() : closeLang();
$('#ext-go').onclick = openWizard;
$('#hint-go').onclick = openWizard;
$('#hint-no').onclick = () => { ui.hintOff = true; saveSoon(); renderMeta(cards.size); };
$('#quitb').onclick = async () => {
  if (!await ask(t('ask.quit.t'), t('ask.quit.p'), t('quit'))) return;
  quitting = true;
  try { await post('/api/quit'); } catch {}
  online(false);
  setTimeout(() => window.close(), 400);
};
$$('.tabs [data-f]').forEach(b => b.addEventListener('click', () => { ui.filter = b.dataset.f; render(); saveSoon(); }));
$$('[data-bulk]').forEach(b => b.addEventListener('click', () => bulk(b.dataset.bulk)));
mqDark.addEventListener('change', () => { if (ui.scheme === 'system') applyTheme('system'); });
mqMotion.addEventListener('change', applyLook);
addEventListener('resize', () => { moveInd(); segs(); });
addEventListener('scroll', () => $('.top').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !isField(e.target) && !document.querySelector('dialog[open]')) { e.preventDefault(); $('#url').focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openDrawer(); }
});
document.addEventListener('paste', e => {
  if (isField(e.target) || document.querySelector('dialog[open]')) return;
  const tx = e.clipboardData.getData('text');
  if (/https?:\/\//i.test(tx)) { e.preventDefault(); addUrls(tx); }
});
let dragDepth = 0;
const hasLink = e => [...e.dataTransfer.types].some(x => x === 'text/uri-list' || x === 'text/plain');
addEventListener('dragenter', e => { if (hasLink(e)) { dragDepth++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', e => { if (hasLink(e)) e.preventDefault(); });
addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  $('#drop').classList.remove('on');
  addUrls((e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain')).split('\n').filter(l => !l.startsWith('#')).join(' '));
});

// ---------- Start ----------
bindSettings();
applyLook();
setLang();
loadSettings().catch(() => {}).finally(() => {
  poll();
  requestAnimationFrame(frame);
  if (ui.updAuto) checkUpdate(false);
  setInterval(() => { if (ui.updAuto) checkUpdate(false); }, 6 * 36e5);
});
</script>
</body>
</html>
