name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Probelauf ohne Release

permissions:
  contents: write

# macOS: später, siehe README
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: speedload-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: speedload-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/speedload
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p dist
          cp "$src" "dist/${{ matrix.name }}"
      - if: runner.os == 'Linux'
        run: packaging/build-linux-packages.sh target/${{ matrix.target }}/release/speedload dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (cd extension && zip -r ../speedload-extension.xpi manifest.json background.js popup.html popup.js icons)
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            speedload-extension.xpi
